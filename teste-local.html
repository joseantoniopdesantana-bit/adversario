<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste — Palavra do Dia</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #fbfbfd; --surface: #ffffff; --primary: #0ea5e9;
    --accent: #10b981; --yellow: #d97706; --gray: #71717a;
    --border: #e4e4e7; --text: #18181b; --text-muted: #52525b;
    --radius: 14px; --tile: 56px; --gap: 8px;
    --font: ui-sans-serif, system-ui, sans-serif;
  }
  body { font-family: var(--font); background: var(--bg);
    color: var(--text); display: flex; flex-direction: column;
    align-items: center; min-height: 100vh; padding: 12px; }
  header { width: 100%; max-width: 430px; display: flex;
    justify-content: space-between; align-items: center;
    padding: 14px 0 8px; }
  .logo { font-size: 20px; font-weight: 700; color: var(--text);
    display: flex; align-items: center; gap: 6px; }
  .screen { width: 100%; max-width: 430px; display: none;
    flex-direction: column; align-items: center; gap: 12px;
    padding: 4px 0 24px; }
  .screen.active { display: flex; }
  .card { background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px; width: 100%;
    box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
  h1 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  p.sub { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; }
  .category-pill { display: inline-flex; align-items: center; gap: 7px;
    background: #fafafa; color: var(--text-muted); font-size: 12px;
    font-weight: 600; padding: 5px 12px; border-radius: 999px;
    border: 1px solid var(--border); margin-bottom: 4px; }
  .grid { display: grid; grid-template-columns: repeat(6, var(--tile));
    gap: var(--gap); margin: 8px 0 12px; }
  .row { display: contents; }
  .tile { width: var(--tile); height: var(--tile); border-radius: 8px;
    border: 1px solid var(--border); display: flex; align-items: center;
    justify-content: center; font-size: 22px; font-weight: 700;
    text-transform: uppercase; color: var(--text); background: var(--surface);
    transition: all 0.18s ease; position: relative; cursor: text; }
  .tile.empty { background: #fafafa; border-style: dashed; }
  .tile.revealed { border-style: solid; }
  .tile.correct { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tile.present { background: var(--yellow); color: #fff; border-color: var(--yellow); }
  .tile.absent { background: var(--gray); color: #fff; border-color: var(--gray); }
  .tile.selected { outline: 3px solid var(--primary); outline-offset: -2px; }
  .tile.animating { animation: flip 0.6s ease-in-out; }
  @keyframes flip {
    0% { transform: rotateX(0); }
    45% { transform: rotateX(90deg); }
    100% { transform: rotateX(0); }
  }
  .keyboard { display: grid; grid-template-columns: repeat(10, 1fr);
    gap: 5px; margin-top: 6px; }
  .key { height: 44px; border-radius: 8px; background: var(--surface);
    border: 1px solid var(--border); font-size: 15px; font-weight: 700;
    text-transform: uppercase; display: flex; align-items: center;
    justify-content: center; color: var(--text); }
  .key.wide { grid-column: span 2; }
  #alert { font-size: 12px; color: #dc2626; font-weight: 600;
    min-height: 16px; display: none; margin-bottom: 4px; }
  .result { text-align: center; padding: 20px 14px; }
  .result h2 { font-size: 20px; margin-bottom: 4px; }
  .result p { color: var(--text-muted); margin-bottom: 12px; font-size: 13px; }
  .share-row { display: flex; gap: 6px; margin-top: 12px; }
  .share-row button { flex: 1; padding: 9px; font-size: 13px; }
  .footer-note { margin-top: 8px; font-size: 11px;
    color: var(--text-muted); text-align: center; }
  .instructions {
    font-size: 12px; color: var(--text-muted);
    margin-top: 8px; text-align: center; line-height: 1.4;
  }
  button { border: none; border-radius: 10px; font-family: inherit;
    font-weight: 600; cursor: pointer; }
  button:active { transform: scale(0.97); }
  .btn-primary { background: var(--primary); color: #fff;
    padding: 12px 20px; font-size: 14px; width: 100%; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-ghost { background: #fafafa; color: var(--text-muted);
    padding: 10px 14px; font-size: 13px; border: 1px solid var(--border); }
</style>
</head>
<body>

<header>
  <div class="logo">🧩 Palavra do Dia</div>
  <div id="catBadge">—</div>
</header>

<!-- TELA INICIAL -->
<div class="screen active" id="screen-home">
  <div class="card" style="max-width:340px;">
    <div class="category-pill" id="homeCat">Tema: <span id="homeCatName">—</span></div>
    <h1>Palavra do Dia</h1>
    <p class="sub">Adivinhe a palavra de 6 letras em até 6 tentativas.</p>
    <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px;">
      <b>Verde:</b> letra certa no lugar certo · <b>Amarelo:</b> letra certa, lugar errado · <b>Cinza:</b> não existe.
    </div>
    <button class="btn-primary" onclick="startGame()">Iniciar partida</button>
  </div>
</div>

<!-- TELA DE PARTIDA -->
<div class="screen" id="screen-game">
  <div class="card">
    <div class="category-pill" id="gameCat">Tema: <span id="gameCatName">—</span></div>
    <div id="turnNum">Tentativa 1 de 6</div>
    <div class="grid" id="board"></div>
    <div id="alert"></div>
    <div class="keyboard" id="keyboard"></div>
    <div class="instructions">
      Clique em um quadrado e digite, ou use o teclado físico.<br>
      Pressione ENTER para enviar.
    </div>
    <button class="btn-ghost" onclick="backHome()" style="margin-top:10px;width:100%;">Voltar ao início</button>
  </div>
</div>

<script>
const WORD_LENGTH = 6;
const MAX_TRIES = 6;
const WORD_BANK = {
  Animais: ["GIRAFA","COELHO","JABUTI","MACACO","CAMELO","ABELHA","JAGUAR","MURICI","VESPAS","LAGARTO"],
  Comida: ["CHURRO","FEIJAO","SALADA","PASTEL","QUEIJO","FRANGO","COZIDO","EMPADA","MOUSSE","GELEIA"],
  Ciencia: ["VACINA","FOSSIL","CELULA","FISICA","PLUTAO","NETUNO","URANIO","CALCIO","OCEANO","VULCAO"],
  Esportes: ["KARATE","EQUIPE","QUADRA","ALTURA","HOCKEI","FUTSAL","SQUASH","TROFEU","BRONZE","EMPATE"]
};

let state = { categoria: '', palavra: '', turn: 0, guesses: [], finished: false, won: false };
let currentRow = 0;
let currentCol = 0;

function pickWord() {
  const cats = Object.keys(WORD_BANK);
  const today = new Date().toISOString().slice(0,10).replace(/-/g,'');
  let hash = 0;
  for (let i=0; i<today.length; i++) hash = ((hash<<5)-hash + today.charCodeAt(i)) | 0;
  const catKey = cats[Math.abs(hash) % cats.length];
  const palavras = WORD_BANK[catKey];
  hash = 0;
  for (let i=0; i<(today+catKey).length; i++) hash = ((hash<<5)-hash + (today+catKey).charCodeAt(i)) | 0;
  const wordIndex = Math.abs(hash) % palavras.length;
  return { categoria: catKey, palavra: palavras[wordIndex].toUpperCase() };
}

function computeFeedback(guess, target) {
  const gl = guess.split(''), tl = target.split('');
  const status = Array(WORD_LENGTH).fill('absent');
  const used = Array(WORD_LENGTH).fill(false);
  for (let i=0; i<WORD_LENGTH; i++) {
    if (gl[i]===tl[i]) { status[i]='correct'; used[i]=true; }
  }
  for (let i=0; i<WORD_LENGTH; i++) {
    if (status[i]!=='absent') continue;
    const idx = tl.findIndex((ch,j)=>!used[j]&&ch===gl[i]);
    if (idx>=0) { status[i]='present'; used[idx]=true; }
  }
  return status;
}

function validateGuess(guess) {
  guess = guess.toUpperCase();
  if (guess.length !== WORD_LENGTH) return {valid:false, error:'length', len:WORD_LENGTH};
  if (state.guesses.some(g=>g.letters.join('')===guess)) return {valid:false, error:'repeated'};
  return {valid:true, guess};
}

function submitGuess(guess) {
  const v = validateGuess(guess);
  if (!v.valid) {
    let m = '';
    if (v.error==='length') m = `Digite ${v.len} letras`;
    else if (v.error==='repeated') m = 'Você já tentou esta palavra';
    showAlert(m);
    return;
  }
  const status = computeFeedback(v.guess, state.palavra);
  const won = v.guess === state.palavra;
  state.guesses.push({letters: v.guess.split(''), status});
  state.turn++;
  if (won || state.turn >= MAX_TRIES) { state.finished = true; state.won = won; }
  renderBoard();
  renderKeyboard();
  if (state.finished) {
    setTimeout(()=>{
      alert(won ? `Parabéns! Acertou em ${state.turn} tentativa${state.turn>1?'s':'!'}` : `Não foi dessa vez. A palavra era ${state.palavra}`);
    }, 500);
  }
}

function getTile(r, c) {
  return document.querySelector(`.tile[data-row="${r}"][data-col="${c}"]`);
}

function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  for (let r=0; r<MAX_TRIES; r++) {
    const row = document.createElement('div'); row.className='row';
    for (let c=0; c<WORD_LENGTH; c++) {
      const t = document.createElement('div');
      t.className='tile empty';
      t.dataset.row = r;
      t.dataset.col = c;
      t.setAttribute('role','button');
      t.setAttribute('tabindex','0');
      t.setAttribute('aria-label',`Linha ${r+1}, coluna ${c+1}`);

      t.onclick = () => selectTile(r, c);
      t.onkeydown = (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectTile(r, c); }
        if (e.key === 'ArrowLeft') { e.preventDefault(); selectTile(r, Math.max(0, c-1)); }
        if (e.key === 'ArrowRight') { e.preventDefault(); selectTile(r, Math.min(WORD_LENGTH-1, c+1)); }
        if (e.key === 'ArrowUp') { e.preventDefault(); selectTile(Math.max(0, r-1), c); }
        if (e.key === 'ArrowDown') { e.preventDefault(); selectTile(Math.min(MAX_TRIES-1, r+1), c); }
      };

      const g = state.guesses[r];
      if (g && g[c]) {
        t.classList.remove('empty');
        t.classList.add('revealed', g.status[c]);
        t.textContent = g[c];
        t.classList.add('animating');
      }
      row.appendChild(t);
    }
    board.appendChild(row);
  }
  selectTile(currentRow, currentCol);
}

function selectTile(r, c) {
  if (r < 0 || r >= MAX_TRIES || c < 0 || c >= WORD_LENGTH) return;
  const g = state.guesses[r];
  if (g && g[c]) return; // já revelado

  currentRow = r;
  currentCol = c;

  document.querySelectorAll('.tile.selected').forEach(el => el.classList.remove('selected'));

  const tile = getTile(r, c);
  if (tile) {
    tile.classList.add('selected');
    tile.focus();
  }
}

function renderKeyboard() {
  const kb = document.getElementById('keyboard');
  kb.innerHTML = '';
  const rows = ['QWERTYUIOP','ASDFGHJKL','ÇZXCVBNM'];
  rows.forEach((rowStr, rowIdx) => {
    const row = document.createElement('div');
    row.style.display='flex'; row.style.gap='5px'; row.style.justifyContent='center'; row.style.marginBottom='5px';
    [...rowStr].forEach(ch => {
      const k = document.createElement('button');
      k.className='key'; k.textContent=ch; k.type='button';
      k.onclick = () => typeChar(ch);
      row.appendChild(k);
    });
    if (rowIdx===1) {
      const del = document.createElement('button');
      del.className='key wide'; del.textContent='APAGAR'; del.type='button';
      del.onclick = () => deleteChar();
      row.appendChild(del);
    }
    if (rowIdx===2) {
      const ent = document.createElement('button');
      ent.className='key wide'; ent.textContent='ENTER'; ent.type='button';
      ent.onclick = submitGuessCurrent;
      row.appendChild(ent);
    }
    kb.appendChild(row);
  });
}

function typeChar(ch) {
  if (state.finished) return;
  const t = getTile(currentRow, currentCol);
  if (t && !t.classList.contains('revealed')) {
    t.textContent = ch;
    t.classList.remove('empty');
    if (currentCol < WORD_LENGTH - 1) {
      selectTile(currentRow, currentCol + 1);
    }
  }
}

function deleteChar() {
  if (state.finished) return;
  const t = getTile(currentRow, currentCol);
  if (t && !t.classList.contains('revealed')) {
    t.textContent = '';
    t.classList.add('empty');
    if (currentCol > 0) {
      selectTile(currentRow, currentCol - 1);
    }
  }
}

function submitGuessCurrent() {
  if (state.finished) return;

  // CORREÇÃO: Ler letras diretamente dos quadrados no DOM, não de array separado
  const letters = [];
  for (let c=0; c<WORD_LENGTH; c++) {
    const t = getTile(currentRow, c);
    letters.push(t ? t.textContent : '');
  }
  const guess = letters.join('').toUpperCase();

  if (guess.length !== WORD_LENGTH || guess.includes('')) {
    showAlert('Preencha todas as 6 letras');
    return;
  }

  submitGuess(guess);
}

function showAlert(m) {
  const el = document.getElementById('alert');
  el.textContent = m;
  el.style.display = 'block';
  setTimeout(()=>el.style.display='none', 2200);
}

function startGame() {
  state = { categoria: '', palavra: '', turn: 0, guesses: [], finished: false, won: false };
  currentRow = 0; currentCol = 0;
  const pw = pickWord();
  state.categoria = pw.categoria; state.palavra = pw.palavra;
  document.getElementById('screen-home').classList.remove('active');
  document.getElementById('screen-game').classList.add('active');
  document.getElementById('gameCatName').textContent = pw.categoria;
  document.getElementById('catBadge').textContent = pw.categoria;
  document.getElementById('turnNum').textContent = 'Tentativa 1 de 6';
  renderBoard();
  renderKeyboard();
}

// Teclado físico global
document.addEventListener('keydown', (e) => {
  if (document.getElementById('screen-game').classList.contains('active') && !state.finished) {
    if ((e.key >= 'a' && e.key <= 'z') || e.key === 'Ç' || e.key === 'ç') {
      e.preventDefault();
      typeChar(e.key.toUpperCase());
    }
    if (e.key === 'Backspace') { e.preventDefault(); deleteChar(); }
    if (e.key === 'Enter') { e.preventDefault(); submitGuessCurrent(); }
    if (e.key === 'ArrowLeft')  { e.preventDefault(); selectTile(currentRow, currentCol-1); }
    if (e.key === 'ArrowRight') { e.preventDefault(); selectTile(currentRow, currentCol+1); }
    if (e.key === 'ArrowUp')    { e.preventDefault(); selectTile(currentRow-1, currentCol); }
    if (e.key === 'ArrowDown')  { e.preventDefault(); selectTile(currentRow+1, currentCol); }
  }
});

function backHome() {
  document.getElementById('screen-game').classList.remove('active');
  document.getElementById('screen-home').classList.add('active');
}
</script>
</body>
</html>
